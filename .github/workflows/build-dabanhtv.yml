name: Build DaBanhTV IPA

# Builds the Đá Banh TV app (tvOS) as an UNSIGNED .ipa: the owner
# signs IPAs himself with his own signing app, so the workflow
# builds with CODE_SIGNING_ALLOWED=NO and simply zips the .app
# into a Payload/ layout. Adapted from the dabanh-ios monorepo's
# build-dabanh.yml build-tvos job when this app split into its
# own repo on 2026-11-18. Dispatch-only, single target.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-tvos:
    runs-on: xcode-27
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Compute unique artifact name
        id: names
        run: |
          DATE="$(date +%Y%m%d)"
          NAME="DaBanhTV-ipa-run${{ github.run_number }}-${DATE}"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "Artifact / IPA name: ${NAME}"

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -euo pipefail
          xcodebuild \
            -project DaBanhTV.xcodeproj \
            -scheme DaBanhTV \
            -configuration Release \
            -destination 'generic/platform=tvOS' \
            CONFIGURATION_BUILD_DIR="$PWD/build/app-tv" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            build
          test -d "$PWD/build/app-tv/DaBanhTV.app"
          ls -la "$PWD/build/app-tv/DaBanhTV.app"

      - name: Assemble IPA
        run: |
          set -euo pipefail
          NAME="${{ steps.names.outputs.name }}"
          rm -rf Payload
          mkdir Payload
          cp -R "$PWD/build/app-tv/DaBanhTV.app" Payload/
          zip -qry "${NAME}.ipa" Payload
          ls -lh "${NAME}.ipa"
          shasum -a 256 "${NAME}.ipa"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.names.outputs.name }}
          path: ${{ steps.names.outputs.name }}.ipa
          if-no-files-found: error
