name: DaBanhTV
options:
  bundleIdPrefix: com.luun.nguyen
  deploymentTarget:
    tvOS: "17.0"
settings:
  base:
    # Swift 6 language mode for the whole project (owner order
    # 2026-11-18). This repo was split out of the dabanh-ios
    # monorepo on 2026-11-18 so Đá Banh TV migrates on its own
    # track; strict concurrency is part of the Swift 6 language
    # mode.
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
targets:
  DaBanhTV:
    type: application
    platform: tvOS
    sources:
      - DaBanh/Channel.swift
      - DaBanh/Crests.swift
      - DaBanh/TeamNameNorm.swift
      - crests/crests.json
      - DaBanh/LeagueClassifier.swift
      - DaBanh/DivisionClassifier.swift
      - DaBanh/M3UParser.swift
      - DaBanh/PlaylistStore.swift
      - DaBanh/Wallpapers.swift
      - wallpapers/wallpapers.json
      - DaBanhTV/DaBanhTVApp.swift
      - DaBanhTV/TVTheme.swift
      - DaBanhTV/NuvioAddon.swift
      - DaBanhTV/MatchStateStore.swift
      - DaBanhTV/TVContentView.swift
      - DaBanhTV/DiagLog.swift
      - DaBanhTV/TVMatchViews.swift
      - DaBanhTV/TVPlayerView.swift
      - DaBanhTV/Assets.xcassets
      # 1.7.5: the design theme's type programme (owner ruling
      # 2026-11-22) — Manrope statics for UI/body, Barlow
      # Condensed 800 for display; the SAME verified files the
      # iOS build bundles (Vietnamese block 90/90, PostScript
      # names read from the files' own name tables). Registered
      # via UIAppFonts below; used ONLY by the design theme's
      # faces (TVDesignFont in TVTheme.swift).
      - path: DaBanhTV/Fonts/Manrope-Light.ttf
      - path: DaBanhTV/Fonts/Manrope-Regular.ttf
      - path: DaBanhTV/Fonts/Manrope-Medium.ttf
      - path: DaBanhTV/Fonts/Manrope-SemiBold.ttf
      - path: DaBanhTV/Fonts/Manrope-Bold.ttf
      - path: DaBanhTV/Fonts/Manrope-ExtraBold.ttf
      - path: DaBanhTV/Fonts/BarlowCondensed-ExtraBold.ttf
    dependencies:
      - target: DaBanhTVTopShelf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.luun.nguyen.dabanhtv
        INFOPLIST_FILE: InfoTV.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.7.10"
        CURRENT_PROJECT_VERSION: "45"
    info:
      path: InfoTV.plist
      properties:
        CFBundleDisplayName: "Đá Banh"
        CFBundleName: "Đá Banh"
        CFBundleShortVersionString: "1.7.10"
        CFBundleVersion: "45"
        CFBundleIconName: "AppIcon"
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconName: "AppIcon"
        UIAppFonts:
          - Manrope-Light.ttf
          - Manrope-Regular.ttf
          - Manrope-Medium.ttf
          - Manrope-SemiBold.ttf
          - Manrope-Bold.ttf
          - Manrope-ExtraBold.ttf
          - BarlowCondensed-ExtraBold.ttf
        UILaunchScreen: {}
  DaBanhTVTopShelf:
    type: app-extension
    platform: tvOS
    sources:
      - DaBanhTVTopShelf/TopShelfProvider.swift
      - DaBanhTVTopShelf/mu-shelf-1.jpg
      - DaBanhTVTopShelf/mu-shelf-2.jpg
      - DaBanhTVTopShelf/mu-shelf-3.jpg
      - DaBanhTVTopShelf/mu-shelf-4.jpg
      - DaBanhTVTopShelf/mu-shelf-5.jpg
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.luun.nguyen.dabanhtv.topshelf
        INFOPLIST_FILE: InfoDaBanhTVTopShelf.plist
    info:
      path: InfoDaBanhTVTopShelf.plist
      properties:
        CFBundleDisplayName: "Đá Banh"
        CFBundleName: "DaBanhTVTopShelf"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.tv-top-shelf
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).TopShelfProvider
